<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Learning - Jingsen 学习中心 1.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-main: #F8F9FB;
            --english-accent: #10B981;
            --english-theme: #ECFDF5;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); }
        .option-btn { transition: all 0.2s ease; }
        .option-btn.correct { background-color: #DEF7EC; border-color: #31C48D; color: #03543F; }
        .option-btn.wrong { background-color: #FDE8E8; border-color: #F98080; color: #9B1C1C; }
        .option-btn.correct-hint { border-color: #31C48D; border-width: 2px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <button id="back-btn" onclick="location.href='/portal'" class="text-gray-500 hover:text-gray-700 flex items-center gap-2 mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                    </svg>
                    Back to Portal
                </button>
                <h1 class="text-3xl font-bold text-gray-900">English Learning</h1>
            </div>
            <div id="progress-text" class="text-sm font-bold text-gray-400">Ready</div>
        </header>

        <div id="page-notice" class="hidden mb-4 px-4 py-3 rounded-xl text-sm font-medium"></div>

        <!-- Configuration -->
        <div id="setup-section" class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-gray-100 mb-8">
            <h2 class="text-xl font-bold mb-6">Quiz Configuration</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Select Library</label>
                    <select id="word-library" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[var(--english-accent)] outline-none">
                        <option value="">自动选择已启用词库</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Word Count</label>
                    <select id="word-count" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[var(--english-accent)] outline-none">
                        <option value="10">10 Words</option>
                        <option value="20">20 Words</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Quiz Mode</label>
                    <select id="quiz-mode" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[var(--english-accent)] outline-none">
                        <option value="cloze">Cloze (完形填空)</option>
                        <option value="match">Match (词义匹配)</option>
                    </select>
                </div>
            </div>
            <button onclick="startQuiz()" id="start-btn" class="w-full py-4 bg-[var(--english-accent)] text-white rounded-2xl font-bold text-lg hover:opacity-90 transition-all shadow-lg shadow-emerald-100">
                Generate Quiz
            </button>
        </div>

        <!-- Quiz Section -->
        <div id="quiz-section" class="hidden">
            <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 mb-6 relative overflow-hidden">
                <div class="absolute top-0 left-0 h-1 bg-gray-100 w-full">
                    <div id="progress-bar" class="h-full bg-[var(--english-accent)] transition-all duration-300" style="width: 0%"></div>
                </div>
                <div id="question-content"></div>
            </div>
            <button id="next-btn" onclick="nextQuestion()" class="hidden w-full py-4 bg-gray-800 text-white rounded-2xl font-bold text-lg hover:bg-black transition-all">
                Next Question
            </button>
        </div>

        <!-- Result Section -->
        <div id="result-section" class="hidden">
            <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 text-center mb-8">
                <div class="inline-flex items-center justify-center w-24 h-24 bg-blue-50 rounded-full mb-6">
                    <span id="score-display" class="text-4xl font-bold text-blue-600">0</span>
                </div>
                <h2 class="text-2xl font-bold mb-4">Quiz Completed!</h2>
                <div id="summary-text" class="text-gray-600 mb-8 p-6 bg-gray-50 rounded-2xl text-left leading-relaxed"></div>
                <button onclick="location.reload()" class="px-8 py-3 border-2 border-gray-200 rounded-xl font-bold text-gray-600 hover:bg-gray-50">
                    Try Another One
                </button>
            </div>
            <div id="wrong-questions-list" class="space-y-4">
                <h3 class="font-bold text-gray-900 px-2">Wrong Questions Review</h3>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-black/10 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-3xl shadow-xl flex flex-col items-center">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-[var(--english-accent)] border-t-transparent mb-4"></div>
            <p class="font-medium text-gray-700">Creating your quiz...</p>
        </div>
    </div>

    <script>
        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let results = [];
        let isAnswered = false;
        let quizInProgress = false;

        // Prevent browser back
        window.addEventListener('popstate', function (event) {
            if (quizInProgress) {
                history.pushState(null, null, window.location.href);
            }
        });

        async function startQuiz() {
            const count = document.getElementById('word-count').value;
            const mode = document.getElementById('quiz-mode').value;
            const library = document.getElementById('word-library').value;

            showLoading(true);
            try {
                const params = new URLSearchParams({ count: String(count), mode });
                if (library) params.set('library', library);
                const response = await fetch(`/api/english/generate?${params.toString()}`);
                const data = await response.json();
                if (!response.ok) throw new Error(getErrorMessage(data, '出题失败'));
                if (!Array.isArray(data.questions) || !data.questions.length) throw new Error('未生成有效题目，请稍后重试');

                questions = data.questions;
                currentIndex = 0;
                score = 0;
                results = [];
                quizInProgress = true;

                // Push state to detect back button
                history.pushState(null, null, window.location.href);

                document.getElementById('back-btn').classList.add('invisible');
                document.getElementById('setup-section').classList.add('hidden');
                document.getElementById('quiz-section').classList.remove('hidden');
                showQuestion();
            } catch (err) {
                showNotice('error', err.message || '出题失败，请稍后重试');
            } finally {
                showLoading(false);
            }
        }

        function showQuestion() {
            isAnswered = false;
            const q = questions[currentIndex];
            const container = document.getElementById('question-content');
            document.getElementById('next-btn').classList.add('hidden');
            
            const progress = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('progress-text').innerText = `Question ${currentIndex + 1} / ${questions.length}`;

            container.innerHTML = `
                <p class="text-xl font-medium text-gray-900 mb-8">${q.sentence.replace('____', '<span id="placeholder" class="px-4 border-b-2 border-gray-300 font-bold text-blue-600">?</span>')}</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${q.options.map(opt => `
                        <button onclick="checkAnswer(this, '${opt}')" class="option-btn w-full p-5 text-left border border-gray-100 rounded-2xl hover:bg-gray-50 font-medium">
                            ${opt}
                        </button>
                    `).join('')}
                </div>
                <div id="explanation" class="hidden mt-8 p-5 bg-blue-50 rounded-2xl text-blue-800 text-sm">
                    <strong>Analysis: </strong> ${q.analysis || 'Keep going!'}
                </div>
            `;
        }

        function checkAnswer(btn, selected) {
            if (isAnswered) return;
            isAnswered = true;
            const q = questions[currentIndex];
            const isCorrect = selected.trim().toLowerCase() === q.answer.trim().toLowerCase();
            
            if (isCorrect) {
                score++;
                btn.classList.add('correct');
            } else {
                btn.classList.add('wrong');
                document.querySelectorAll('.option-btn').forEach(b => {
                    if (b.innerText.trim().toLowerCase() === q.answer.trim().toLowerCase()) b.classList.add('correct-hint');
                });
            }

            results.push({ ...q, userAnswer: selected, isCorrect });
            document.getElementById('explanation').classList.remove('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
            const placeholder = document.getElementById('placeholder');
            if (placeholder) {
                placeholder.innerText = q.answer;
                placeholder.className = `px-4 border-b-2 font-bold ${isCorrect ? 'text-green-600 border-green-300' : 'text-red-600 border-red-300'}`;
            }
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < questions.length) showQuestion();
            else showReport();
        }

        async function showReport() {
            quizInProgress = false;
            document.getElementById('back-btn').classList.remove('invisible');
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');
            const accuracy = Math.round((score / questions.length) * 100);
            document.getElementById('score-display').innerText = `${accuracy}%`;

            const wrongList = document.getElementById('wrong-questions-list');
            results.filter(r => !r.isCorrect).forEach(w => {
                const item = document.createElement('div');
                item.className = 'bg-white rounded-2xl p-6 shadow-sm border border-gray-100';
                item.innerHTML = `<p class="mb-2">${w.sentence}</p><p class="text-sm"><span class="text-red-500">Your: ${w.userAnswer}</span> | <span class="text-green-600">Correct: ${w.answer}</span></p><p class="text-xs text-gray-500 mt-2 italic">${w.analysis}</p>`;
                wrongList.appendChild(item);
            });

            try {
                const response = await fetch('/api/english/grade', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ questions, answers: results.map((r,i)=>({question_index:i, user_answer:r.userAnswer})), mode: document.getElementById('quiz-mode').value })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(getErrorMessage(data, '总结生成失败'));
                document.getElementById('summary-text').innerText = data.summary;
            } catch (e) {
                document.getElementById('summary-text').innerText = "Good job! Keep practicing.";
                showNotice('error', e.message || '总结生成失败，已使用默认文案');
            }
        }

        function showLoading(show) {
            document.getElementById('loading-overlay').classList.toggle('hidden', !show);
        }

        function getErrorMessage(payload, fallback) {
            if (!payload) return fallback;
            return payload.detail || payload.error || fallback;
        }

        function showNotice(type, message) {
            const el = document.getElementById('page-notice');
            el.className = `mb-4 px-4 py-3 rounded-xl text-sm font-medium ${type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`;
            el.textContent = message;
            el.classList.remove('hidden');
            clearTimeout(window.__pageNoticeTimer__);
            window.__pageNoticeTimer__ = setTimeout(() => el.classList.add('hidden'), 2800);
        }

        function setStartAvailability(enabled, reason = '') {
            const btn = document.getElementById('start-btn');
            btn.disabled = !enabled;
            btn.classList.toggle('opacity-50', !enabled);
            btn.classList.toggle('cursor-not-allowed', !enabled);
            if (reason) showNotice('error', reason);
        }

        async function loadEnabledLibraries() {
            const mode = document.getElementById('quiz-mode').value;
            const select = document.getElementById('word-library');
            const previous = select.value;
            select.innerHTML = '<option value="">自动选择已启用词库</option>';
            try {
                const res = await fetch(`/api/english/libraries?mode=${mode}`);
                const libraries = await res.json();
                if (!res.ok) throw new Error(getErrorMessage(libraries, '加载词库失败'));
                if (!Array.isArray(libraries)) throw new Error('词库响应格式错误');

                libraries.forEach(name => {
                    const option = document.createElement('option');
                    option.value = name;
                    option.textContent = name;
                    select.appendChild(option);
                });
                if (previous && libraries.includes(previous)) {
                    select.value = previous;
                }

                if (!libraries.length) {
                    setStartAvailability(false, '当前题型下没有可用词库，请先在后台启用词库');
                } else {
                    setStartAvailability(true);
                }
            } catch (e) {
                setStartAvailability(false, e.message || '加载词库失败，请稍后重试');
            }
        }

        document.getElementById('quiz-mode').addEventListener('change', loadEnabledLibraries);
        loadEnabledLibraries();
    </script>
</body>
</html>
