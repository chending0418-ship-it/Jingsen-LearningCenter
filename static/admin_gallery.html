<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Gallery 管理 — Jingsen.cc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --paper:#f2f0e8; --ink:#121212; --blue:#1646d8; --purple:#c9b5ff; --line:#ceccc3; }
        * { box-sizing:border-box; }
        [hidden] { display:none !important; }
        body { margin:0; color:var(--ink); background:var(--paper); font-family:Manrope,"PingFang SC",system-ui,sans-serif; }
        button,input,textarea { font:inherit; }
        button { cursor:pointer; }
        .shell { width:min(1450px,100%); margin:auto; padding:0 clamp(18px,3.4vw,52px) 80px; }
        nav { min-height:78px; display:flex; align-items:center; justify-content:space-between; gap:20px; border-bottom:1px solid var(--line); }
        nav a { color:inherit; text-decoration:none; }
        .brand { font-size:22px; font-weight:800; letter-spacing:-.05em; }
        .nav-links { display:flex; gap:20px; font:500 11px/1 "DM Mono",monospace; letter-spacing:.06em; text-transform:uppercase; }
        header { padding:55px 0 34px; display:flex; align-items:end; justify-content:space-between; gap:30px; }
        .kicker { font:500 11px/1 "DM Mono",monospace; color:var(--blue); letter-spacing:.1em; text-transform:uppercase; }
        h1 { margin:12px 0 0; font-size:clamp(48px,7vw,90px); line-height:.85; letter-spacing:-.075em; }
        header p { max-width:500px; margin:0; color:#66645e; line-height:1.55; }
        .upload { display:grid; grid-template-columns:minmax(300px,.9fr) minmax(0,1.1fr); border:1px solid var(--ink); background:white; }
        .preview { min-height:500px; display:grid; place-items:center; position:relative; overflow:hidden; background:var(--purple); border-right:1px solid var(--ink); }
        .preview img { width:100%; height:100%; object-fit:cover; display:none; }
        .preview.has-image img { display:block; }
        .preview.has-image .preview-empty { display:none; }
        .preview-empty { max-width:280px; text-align:center; font:500 12px/1.6 "DM Mono",monospace; text-transform:uppercase; }
        .upload-form { padding:clamp(24px,4vw,52px); display:grid; grid-template-columns:1fr 1fr; gap:17px; align-content:start; }
        .field { display:grid; gap:7px; }
        .field.full { grid-column:1/-1; }
        label { font-size:12px; font-weight:800; }
        input,textarea { width:100%; padding:12px 13px; border:1px solid #bdbbb3; border-radius:0; background:#fbfaf6; outline:none; }
        input:focus,textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(22,70,216,.12); }
        textarea { min-height:90px; resize:vertical; line-height:1.5; }
        .file { display:none; }
        .actions { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:5px; }
        .button { min-height:43px; padding:0 16px; border:1px solid var(--ink); background:white; color:var(--ink); font:600 11px/1 "DM Mono",monospace; letter-spacing:.05em; text-transform:uppercase; }
        .button.primary { background:var(--ink); color:white; }
        .button.primary:hover { background:var(--blue); }
        .button.danger { color:#a31c12; border-color:#d4a29d; }
        .button:disabled { opacity:.45; cursor:not-allowed; }
        .status { min-height:19px; grid-column:1/-1; font-size:12px; font-weight:700; }
        .status.success { color:#087343; }.status.error { color:#b42318; }
        .library-head { display:flex; align-items:end; justify-content:space-between; gap:20px; margin:90px 0 24px; }
        .library-head h2 { margin:0; font-size:clamp(38px,5vw,66px); letter-spacing:-.065em; line-height:.9; }
        .library-head span { font:500 11px/1 "DM Mono",monospace; letter-spacing:.08em; }
        .items { display:grid; gap:12px; }
        .item { display:grid; grid-template-columns:180px 1fr auto; gap:22px; padding:12px; border:1px solid var(--line); background:white; align-items:start; }
        .item-image { width:180px; aspect-ratio:4/3; object-fit:cover; background:#ddd; }
        .item-fields { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .item-fields textarea { min-height:72px; }
        .item-actions { display:grid; gap:8px; }
        .empty { padding:70px 20px; border:1px dashed #a5a39b; text-align:center; color:#6a6861; }
        @media(max-width:900px){header{align-items:start;flex-direction:column}.upload{grid-template-columns:1fr}.preview{min-height:420px;border-right:0;border-bottom:1px solid var(--ink)}.item{grid-template-columns:130px 1fr}.item-image{width:130px}.item-actions{grid-column:1/-1;grid-template-columns:1fr 1fr}.nav-links a:first-child{display:none}}
        @media(max-width:620px){.upload-form,.item-fields{grid-template-columns:1fr}.field.full{grid-column:auto}.item{grid-template-columns:1fr}.item-image{width:100%;aspect-ratio:auto;max-height:420px}.item-actions{grid-template-columns:1fr}.preview{min-height:320px}}
    </style>
</head>
<body>
    <div class="shell">
        <nav><a class="brand" href="/admin">jingsen.cc / admin</a><div class="nav-links"><a href="/admin">← 管理首页</a><a href="/gallery" target="_blank">查看 Gallery ↗</a></div></nav>
        <header><div><span class="kicker">Gallery admin / 03</span><h1>影像管理</h1></div><p>上传拍摄内容并补充标题、说明、地点与日期。发布后会立即进入前台瀑布流。</p></header>

        <section class="upload">
            <div class="preview" id="preview"><div class="preview-empty">SELECT A FRAME<br>JPG · PNG · WEBP<br>MAX 15MB</div><img id="preview-image" alt="待上传图片预览"></div>
            <form class="upload-form" id="upload-form">
                <input class="file" id="file" type="file" accept="image/jpeg,image/png,image/webp" required>
                <div class="field full"><label for="title">标题</label><input id="title" maxlength="100" placeholder="这张照片叫什么？" required></div>
                <div class="field full"><label for="caption">说明</label><textarea id="caption" maxlength="600" placeholder="拍摄时发生了什么，或者为什么留下它。"></textarea></div>
                <div class="field"><label for="location">地点</label><input id="location" maxlength="100" placeholder="Beijing / Tokyo / ..."></div>
                <div class="field"><label for="shot-date">拍摄日期</label><input id="shot-date" type="date"></div>
                <div class="field full"><label for="alt">图片描述（无障碍）</label><input id="alt" maxlength="180" placeholder="简短描述画面内容" required></div>
                <div class="actions"><button class="button" type="button" onclick="document.getElementById('file').click()">选择照片</button><button class="button primary" id="upload" type="submit" disabled>上传并发布 ↗</button><span id="file-name"></span></div>
                <div class="status" id="upload-status" role="status"></div>
            </form>
        </section>

        <div class="library-head"><h2>已发布内容</h2><span id="item-count">— ITEMS</span></div>
        <section class="items" id="items"></section>
    </div>
    <script>
        let selectedFile = null;
        let previewUrl = null;
        const itemsRoot = document.getElementById('items');

        function setStatus(message,type='') { const el=document.getElementById('upload-status');el.textContent=message;el.className=`status ${type}`; }
        function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
        async function api(path,options={}){
            const response=await fetch(path,{cache:'no-store',...options});
            const data=await response.json().catch(()=>({}));
            if(response.status===401){location.href=`/admin?next=${encodeURIComponent('/admin/gallery')}`;throw new Error('需要重新登录');}
            if(!response.ok)throw new Error(data.detail||`请求失败（${response.status}）`);return data;
        }
        function itemTemplate(item){
            return `<article class="item" data-id="${escapeHtml(item.id)}">
                <img class="item-image" src="${escapeHtml(item.image_url)}" alt="${escapeHtml(item.alt)}" loading="lazy">
                <div class="item-fields">
                    <div class="field full"><label>标题</label><input data-name="title" maxlength="100" value="${escapeHtml(item.title)}"></div>
                    <div class="field full"><label>说明</label><textarea data-name="caption" maxlength="600">${escapeHtml(item.caption)}</textarea></div>
                    <div class="field"><label>地点</label><input data-name="location" maxlength="100" value="${escapeHtml(item.location)}"></div>
                    <div class="field"><label>拍摄日期</label><input data-name="shot_date" type="date" value="${escapeHtml(item.shot_date||'')}"></div>
                    <div class="field full"><label>图片描述</label><input data-name="alt" maxlength="180" value="${escapeHtml(item.alt)}"></div>
                </div>
                <div class="item-actions"><button class="button primary" type="button" onclick="saveItem('${item.id}')">保存</button><button class="button danger" type="button" onclick="removeItem('${item.id}')">移除</button></div>
            </article>`;
        }
        async function loadItems(){
            try{const data=await api('/api/admin/gallery');document.getElementById('item-count').textContent=`${data.total} ITEMS`;itemsRoot.innerHTML=data.items.length?data.items.map(itemTemplate).join(''):'<div class="empty">还没有上传照片。第一张照片会成为 Gallery 的开场。</div>';}
            catch(error){itemsRoot.innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`;}
        }
        document.getElementById('file').addEventListener('change',event=>{
            selectedFile=event.target.files[0]||null;document.getElementById('upload').disabled=!selectedFile;
            if(previewUrl)URL.revokeObjectURL(previewUrl);
            if(!selectedFile)return;
            previewUrl=URL.createObjectURL(selectedFile);document.getElementById('preview-image').src=previewUrl;document.getElementById('preview').classList.add('has-image');document.getElementById('file-name').textContent=`${selectedFile.name} · ${(selectedFile.size/1024/1024).toFixed(2)}MB`;
            if(!document.getElementById('alt').value)document.getElementById('alt').value=document.getElementById('title').value||'Gallery photograph';
        });
        document.getElementById('upload-form').addEventListener('submit',async event=>{
            event.preventDefault();if(!selectedFile)return;const button=document.getElementById('upload');button.disabled=true;setStatus('正在上传…');
            const query=new URLSearchParams({title:document.getElementById('title').value.trim(),caption:document.getElementById('caption').value.trim(),location:document.getElementById('location').value.trim(),alt:document.getElementById('alt').value.trim()});
            const shotDate=document.getElementById('shot-date').value;if(shotDate)query.set('shot_date',shotDate);
            try{await api(`/api/admin/gallery/items?${query}`,{method:'POST',headers:{'Content-Type':selectedFile.type},body:selectedFile});event.target.reset();selectedFile=null;document.getElementById('preview').classList.remove('has-image');document.getElementById('file-name').textContent='';setStatus('照片已发布到 Gallery。','success');await loadItems();}
            catch(error){setStatus(error.message,'error');button.disabled=false;}
        });
        async function saveItem(id){
            const item=document.querySelector(`[data-id="${id}"]`);const value=name=>item.querySelector(`[data-name="${name}"]`).value.trim();
            try{await api(`/api/admin/gallery/items/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:value('title'),caption:value('caption'),location:value('location'),shot_date:value('shot_date')||null,alt:value('alt')})});setStatus('内容资料已保存。','success');}
            catch(error){setStatus(error.message,'error');}
        }
        async function removeItem(id){
            if(!confirm('确认从 Gallery 中移除这张照片吗？原始文件会保留在 data 中以便恢复。'))return;
            try{await api(`/api/admin/gallery/items/${id}`,{method:'DELETE'});setStatus('已从前台 Gallery 移除；图片文件仍保留。','success');await loadItems();}
            catch(error){setStatus(error.message,'error');}
        }
        loadItems();
    </script>
</body>
</html>
