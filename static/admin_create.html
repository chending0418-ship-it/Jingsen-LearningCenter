<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增词库</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg-main: #F8F9FB; --accent: #4F46E5; }
        body { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; background: var(--bg-main); }
        .card { border: 1px solid #E5E7EB; border-radius: 16px; background: #fff; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div id="notice" class="hidden fixed right-4 top-4 z-50 px-4 py-3 rounded-xl text-sm font-medium shadow-lg"></div>

    <div class="max-w-3xl mx-auto space-y-4">
        <header>
            <button onclick="location.href=withBasePath('/admin')" class="text-gray-500 hover:text-gray-700 flex items-center gap-2 mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg>
                返回列表
            </button>
            <h1 class="text-3xl font-bold text-gray-900">新增词库</h1>
        </header>

        <div class="card p-5 space-y-4">
            <div>
                <label class="block text-sm text-gray-600 mb-1">学科</label>
                <select id="create-subject" class="w-full p-2.5 border border-gray-200 rounded-xl" onchange="syncTypeOptions()">
                    <option value="english">英语</option>
                    <option value="chinese">语文</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">词库名称</label>
                <input id="create-name" type="text" placeholder="例如: english_core_3000" class="w-full p-2.5 border border-gray-200 rounded-xl">
            </div>
            <div id="create-type-row">
                <label class="block text-sm text-gray-600 mb-1">词库类型</label>
                <select id="create-type" class="w-full p-2.5 border border-gray-200 rounded-xl"></select>
                <p id="english-type-note" class="hidden mt-2 text-sm text-emerald-700 bg-emerald-50 border border-emerald-100 rounded-xl px-3 py-2">英语词库为通用词库，可用于 Word Palace 的所有练习类型。</p>
            </div>
            <label class="inline-flex items-center gap-2 text-sm text-gray-700">
                <input id="create-enabled" type="checkbox" checked class="w-4 h-4"> 创建后立即启用
            </label>
            <div>
                <label class="block text-sm text-gray-600 mb-1">词条（每行一个；英语也支持逗号分隔）</label>
                <textarea id="create-items" rows="10" class="w-full p-2.5 border border-gray-200 rounded-xl" placeholder="apple\nbanana\ncherry"></textarea>
            </div>
            <div class="flex gap-2">
                <button onclick="location.href=withBasePath('/admin')" class="flex-1 py-2.5 rounded-xl border border-gray-300 hover:bg-gray-50">取消</button>
                <button onclick="createLibrary()" class="flex-1 py-2.5 rounded-xl bg-[var(--accent)] text-white font-semibold hover:opacity-90">创建</button>
            </div>
        </div>
    </div>

    <script>
        const BASE_PATH = window.location.pathname.startsWith('/learningcenter') ? '/learningcenter' : '';
        const withBasePath = (path) => `${BASE_PATH}${path}`;
        const rawFetch = window.fetch.bind(window);
        window.fetch = (input, init) => {
            if (typeof input === 'string' && input.startsWith('/') && !input.startsWith('//')) {
                return rawFetch(withBasePath(input), init);
            }
            return rawFetch(input, init);
        };

        const CHINESE_TYPES = [
            { value: '', label: '无指定类型' },
            { value: 'word_discrim', label: '词语辨析' },
            { value: 'conj_fill', label: '关联词填空' },
            { value: 'idiom_fill', label: '成语填空' }
        ];
        const ENGLISH_TYPES = [
            { value: '', label: '通用' }
        ];

        function showNotice(type, message) {
            const el = document.getElementById('notice');
            el.className = `fixed right-4 top-4 z-50 px-4 py-3 rounded-xl text-sm font-medium shadow-lg ${type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-700 border border-red-200'}`;
            el.textContent = message;
            el.classList.remove('hidden');
            clearTimeout(window.__noticeTimer__);
            window.__noticeTimer__ = setTimeout(() => el.classList.add('hidden'), 2800);
        }

        function fillSelect(selectId, options) {
            const target = document.getElementById(selectId);
            target.innerHTML = options.map(opt => `<option value="${opt.value}">${opt.label}</option>`).join('');
        }

        function syncTypeOptions() {
            const subject = document.getElementById('create-subject').value;
            const isEnglish = subject === 'english';
            fillSelect('create-type', isEnglish ? ENGLISH_TYPES : CHINESE_TYPES);
            document.getElementById('create-type').classList.toggle('hidden', isEnglish);
            document.getElementById('english-type-note').classList.toggle('hidden', !isEnglish);
        }

        function normalizeItems(raw, subject) {
            if (!raw.trim()) return [];
            if (subject === 'english') {
                return raw.split(/[,，\n]/).map(x => x.trim()).filter(Boolean);
            }
            return raw.split('\n').map(x => x.trim()).filter(Boolean);
        }

        async function createLibrary() {
            const subject = document.getElementById('create-subject').value;
            const name = document.getElementById('create-name').value.trim();
            const library_type = subject === 'english' ? null : (document.getElementById('create-type').value || null);
            const enabled = document.getElementById('create-enabled').checked;
            const items = normalizeItems(document.getElementById('create-items').value, subject);

            if (!name) return showNotice('error', '创建失败：请填写词库名称');
            if (!items.length) return showNotice('error', '创建失败：请至少提供 1 条词条');

            try {
                const res = await fetch('/api/admin/libraries', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subject, name, items, enabled, library_type })
                });
                const data = await res.json();
                if (!res.ok) return showNotice('error', `创建失败：${data.detail || '未知错误'}`);

                showNotice('success', '创建成功，正在跳转详情页...');
                setTimeout(() => { location.href = withBasePath(`/admin/library?id=${data.id}`); }, 500);
            } catch (e) {
                showNotice('error', `创建失败：${e.message || '网络错误'}`);
            }
        }

        syncTypeOptions();
    </script>
</body>
</html>
