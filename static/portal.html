<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jingsen 学习中心 1.0</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-main: #F8F9FB;
            --text-primary: #1A1A1A;
            --text-secondary: #6B7280;
            --chinese-theme: #FFEDED;
            --chinese-accent: #FF4B4B;
            --math-theme: #EEF7FF;
            --math-accent: #3B82F6;
            --english-theme: #ECFDF5;
            --english-accent: #10B981;
            --todo-theme: #FFF7E7;
            --todo-accent: #D97706;
            --admin-theme: #EEF2FF;
            --admin-accent: #4F46E5;
        }

        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            -webkit-tap-highlight-color: transparent;
        }

        .container-custom {
            width: 100%;
            max-width: 1024px;
            margin: 0 auto;
        }

        .course-card {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .course-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(130deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0));
            pointer-events: none;
        }

        .course-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 34px rgba(15, 23, 42, 0.14);
            filter: saturate(1.05);
        }

        .course-card:active {
            transform: scale(0.98);
        }

        .progress-bar-container {
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.02);
        }

        /* Subject Image Placeholder Styles */
        .subject-img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f0f0f0;
            flex-shrink: 0;
        }

        @media (min-width: 768px) {
            .subject-img {
                width: 100px;
                height: 100px;
            }
            .course-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
                gap: 1.5rem;
            }
        }

        .card-chinese { background: linear-gradient(145deg, #fff4f4, #ffe2e2); }
        .card-math { background: linear-gradient(145deg, #f2f8ff, #dbeafe); }
        .card-english { background: linear-gradient(145deg, #effef6, #d1fae5); }
        .card-todo { background: linear-gradient(145deg, #fffaf0, #fdecc8); }
        .card-admin { background: linear-gradient(145deg, #f3f4ff, #e0e7ff); }

        .img-chinese { background: linear-gradient(135deg, #FFE4E1, #FFB6C1); }
        .img-math { background: linear-gradient(135deg, #B0C4DE, #87CEEB); }
        .img-english { background: linear-gradient(135deg, #E0FFF0, #98FB98); }
        .img-todo { background: linear-gradient(135deg, #FEF3C7, #FCD34D); }
        .img-admin { background: linear-gradient(135deg, #E0E7FF, #C7D2FE); }

    </style>
</head>
<body class="min-h-screen pb-32 md:pb-40">
    <!-- Main Content -->
    <main class="container-custom px-6 py-4 md:py-12">
        <header class="mb-6 md:mb-12">
            <h2 class="text-3xl md:text-5xl font-extrabold tracking-tight mb-2">Choose your course</h2>
            <p class="text-gray-500 text-base md:text-xl">Pick a subject to start your learning journey.</p>
        </header>

        <!-- Course List -->
        <div class="course-grid space-y-4 md:space-y-0">
            <div class="course-card card-chinese rounded-3xl p-4 md:p-6 flex items-center md:flex-col md:text-center justify-between cursor-pointer" onclick="selectSubject('chinese')">
                <div class="flex items-center md:flex-col md:w-full md:justify-center gap-2 md:gap-4">
                    <span class="text-xl md:text-2xl">📖</span>
                    <h3 class="text-lg md:text-xl font-bold">Chinese</h3>
                </div>
                <div class="subject-img img-chinese ml-4 md:ml-0 md:mt-6">
                    <span class="text-3xl md:text-4xl">🖌️</span>
                </div>
            </div>

            <div class="course-card card-math rounded-3xl p-4 md:p-6 flex items-center md:flex-col md:text-center justify-between cursor-pointer" onclick="selectSubject('math')">
                <div class="flex items-center md:flex-col md:w-full md:justify-center gap-2 md:gap-4">
                    <span class="text-xl md:text-2xl">🔢</span>
                    <h3 class="text-lg md:text-xl font-bold">Math</h3>
                </div>
                <div class="subject-img img-math ml-4 md:ml-0 md:mt-6">
                    <span class="text-3xl md:text-4xl">📐</span>
                </div>
            </div>

            <div class="course-card card-english rounded-3xl p-4 md:p-6 flex items-center md:flex-col md:text-center justify-between cursor-pointer" onclick="selectSubject('english')">
                <div class="flex items-center md:flex-col md:w-full md:justify-center gap-2 md:gap-4">
                    <span class="text-xl md:text-2xl">🔤</span>
                    <h3 class="text-lg md:text-xl font-bold">English</h3>
                </div>
                <div class="subject-img img-english ml-4 md:ml-0 md:mt-6">
                    <span class="text-3xl md:text-4xl">🌍</span>
                </div>
            </div>

            <div class="course-card card-todo rounded-3xl p-4 md:p-6 flex items-center md:flex-col md:text-center justify-between cursor-pointer" onclick="selectSubject('todo')">
                <div class="flex items-center md:flex-col md:w-full md:justify-center gap-2 md:gap-4">
                    <span class="text-xl md:text-2xl">✓</span>
                    <h3 class="text-lg md:text-xl font-bold">Todo</h3>
                </div>
                <div class="subject-img img-todo ml-4 md:ml-0 md:mt-6">
                    <span class="text-3xl md:text-4xl">🗒️</span>
                </div>
            </div>

            <div class="course-card card-admin rounded-3xl p-4 md:p-6 flex items-center md:flex-col md:text-center justify-between cursor-pointer" onclick="selectSubject('admin')">
                <div class="flex items-center md:flex-col md:w-full md:justify-center gap-2 md:gap-4">
                    <span class="text-xl md:text-2xl">🛠️</span>
                    <h3 class="text-lg md:text-xl font-bold">Admin</h3>
                </div>
                <div class="subject-img img-admin ml-4 md:ml-0 md:mt-6">
                    <span class="text-3xl md:text-4xl">⚙️</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Progress Bar Removed -->

    <div id="admin-auth-modal" class="fixed inset-0 bg-black/40 hidden items-start justify-center pt-[12vh] md:pt-[16vh] z-50">
        <div class="bg-white rounded-2xl shadow-xl w-[92%] max-w-sm p-6">
            <h3 class="text-lg font-bold text-gray-900 mb-2">管理员验证</h3>
            <p class="text-sm text-gray-500 mb-4">请输入后台密码</p>
            <input id="admin-password-input" type="password" class="w-full p-3 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" placeholder="请输入密码" />
            <p id="admin-auth-error" class="text-sm text-red-500 mt-2 hidden">密码错误，请重试</p>
            <div class="flex gap-2 mt-5">
                <button onclick="closeAdminAuth()" class="flex-1 py-2.5 border border-gray-300 rounded-xl text-gray-700 hover:bg-gray-50">取消</button>
                <button onclick="confirmAdminAuth()" class="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl hover:opacity-90">确认</button>
            </div>
        </div>
    </div>

    <script>
        const BASE_PATH = window.location.pathname.startsWith('/learningcenter') ? '/learningcenter' : '';
        const withBasePath = (path) => `${BASE_PATH}${path}`;

        function openAdminAuth() {
            const modal = document.getElementById('admin-auth-modal');
            const input = document.getElementById('admin-password-input');
            const error = document.getElementById('admin-auth-error');
            error.classList.add('hidden');
            input.value = '';
            document.body.style.overflow = 'hidden';
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => input.focus(), 0);
        }

        function closeAdminAuth() {
            const modal = document.getElementById('admin-auth-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = '';
        }

        async function confirmAdminAuth() {
            const input = document.getElementById('admin-password-input');
            const error = document.getElementById('admin-auth-error');
            error.classList.add('hidden');
            try {
                const response = await fetch(withBasePath('/api/admin/session'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: input.value })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
            } catch (requestError) {
                error.classList.remove('hidden');
                return;
            }
            closeAdminAuth();
            window.location.href = withBasePath('/admin');
        }

        function selectSubject(subject) {
            console.log('Selected subject:', subject);
            if (subject === 'english') {
                window.location.href = withBasePath('/english');
            } else if (subject === 'chinese') {
                window.location.href = withBasePath('/chinese');
            } else if (subject === 'math') {
                window.location.href = withBasePath('/math');
            } else if (subject === 'todo') {
                window.location.href = withBasePath('/todo');
            } else if (subject === 'admin') {
                openAdminAuth();
            } else {
                alert(subject.charAt(0).toUpperCase() + subject.slice(1) + ' module is coming soon!');
            }
        }

        document.getElementById('admin-password-input').addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeAdminAuth();
            if (e.key === 'Enter') confirmAdminAuth();
        });

        if (new URLSearchParams(window.location.search).get('admin') === '1') {
            openAdminAuth();
        }
    </script>
</body>
</html>
