<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Book Reading 管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--paper:#f2f0e8;--ink:#121212;--blue:#1646d8;--acid:#dfff00;--purple:#c9b8ff;--amber:#ffd16a;--red:#ff4c2f;--line:rgba(18,18,18,.3);--muted:#65635d}
        *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;color:var(--ink);background:var(--paper);font-family:Manrope,"Noto Sans SC",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{width:min(1420px,calc(100% - 40px));margin:auto;padding-bottom:70px}
        nav{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}nav a{color:inherit;text-decoration:none}.crumbs{font:500 10px/1 "DM Mono",monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--blue)}
        header{padding:35px 0 23px;display:flex;align-items:end;justify-content:space-between;gap:30px}h1{font-size:clamp(42px,6vw,76px);line-height:.88;letter-spacing:-.07em;margin:10px 0 0}.kicker,label{font:500 10px/1 "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}header p{max-width:500px;color:var(--muted);line-height:1.55;margin:0}
        .tabs{display:flex;border:1px solid var(--ink);margin:10px 0 20px}.tab{border:0;border-right:1px solid var(--ink);background:white;padding:13px 18px;font-weight:800}.tab.active{background:var(--acid)}
        .panel{border:1px solid var(--ink);background:white}.upload{display:grid;grid-template-columns:320px 1fr}.upload-drop{background:var(--purple);border-right:1px solid var(--ink);display:grid;place-items:center;min-height:400px;padding:30px;text-align:center}.upload-drop strong{display:block;font-size:25px}.upload-drop p{font:500 11px/1.5 "DM Mono",monospace}.form{padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:0;background:#fbfaf6;outline:none}textarea{min-height:90px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:inset 0 -3px 0 var(--blue)}.file{display:none}.button{min-height:42px;padding:0 15px;border:1px solid var(--ink);background:white;font:600 10px/1 "DM Mono",monospace;letter-spacing:.055em;text-transform:uppercase}.button.primary{background:var(--ink);color:white}.button.blue{background:var(--blue);border-color:var(--blue);color:white}.button.danger{color:#a31c12;border-color:#d9988e}.button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.status-line{min-height:22px;margin:14px 0;color:var(--muted);font-weight:700}.status-line.error{color:#a31c12}.status-line.success{color:#087343}
        .section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:50px 0 16px}.section-head h2{font-size:clamp(30px,4vw,50px);line-height:.9;letter-spacing:-.06em;margin:0}.section-head input{width:260px}.books{display:grid;gap:10px}.book{display:grid;grid-template-columns:80px 1fr auto;gap:16px;border:1px solid var(--line);background:white;padding:10px;align-items:center}.thumb{width:80px;height:104px;background:var(--purple);display:grid;place-items:center;font-size:30px;font-weight:800;object-fit:cover}.book h3{margin:0;font-size:20px}.book p{margin:6px 0 0;color:var(--muted);font-size:12px}.badge{display:inline-block;padding:5px 8px;background:#eee;font:500 9px/1 "DM Mono",monospace;text-transform:uppercase}.badge.published{background:var(--acid)}.badge.draft{background:var(--amber)}.badge.archived{background:#ddd}.empty{padding:55px;border:1px dashed var(--line);text-align:center;color:var(--muted)}
        dialog{width:min(1100px,calc(100% - 28px));max-height:92vh;border:1px solid var(--ink);padding:0;background:var(--paper)}dialog::backdrop{background:rgba(0,0,0,.55)}.modal-head{position:sticky;top:0;z-index:2;background:var(--acid);border-bottom:1px solid var(--ink);padding:15px 20px;display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.modal-body{padding:20px}.edit-grid{display:grid;grid-template-columns:1fr 260px;gap:16px}.edit-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cover-box{border:1px solid var(--line);background:white;padding:12px}.cover-box img{width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--purple)}.chapters-head{display:flex;justify-content:space-between;align-items:end;margin:30px 0 10px}.chapter-row{display:grid;grid-template-columns:1fr 110px 110px auto;gap:8px;margin-bottom:8px}.chapter-row input{background:white}.hint{color:var(--muted);font-size:12px;line-height:1.5}.warning{padding:11px;background:var(--amber);border:1px solid var(--ink);font-size:12px;margin-bottom:15px}
        .sessions{display:grid;grid-template-columns:360px 1fr;border:1px solid var(--ink);min-height:520px;background:white}.session-list{border-right:1px solid var(--ink)}.session-item{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:white;padding:15px}.session-item.active{background:var(--acid)}.session-item strong{display:block}.session-item span{font-size:11px;color:var(--muted)}.report{padding:24px}.report h3{font-size:30px;margin:0 0 10px}.summary{padding:15px;background:var(--purple);border:1px solid var(--ink);line-height:1.55}.qa{margin-top:12px;border-top:1px solid var(--ink);padding-top:14px}.qa h4{font-size:17px;margin:0 0 8px}.qa p{font-size:13px;line-height:1.55;margin:6px 0}.answer{padding:10px;background:#f5f4ef}.parent-note{color:var(--blue)}
        @media(max-width:850px){header{align-items:start;flex-direction:column}.upload,.edit-grid,.sessions{grid-template-columns:1fr}.upload-drop{border-right:0;border-bottom:1px solid var(--ink);min-height:220px}.session-list{border-right:0;border-bottom:1px solid var(--ink);max-height:300px;overflow:auto}}
        @media(max-width:560px){.shell{width:calc(100% - 24px)}.form,.edit-fields{grid-template-columns:1fr}.field.full{grid-column:auto}.book{grid-template-columns:60px 1fr}.thumb{width:60px;height:80px}.book .actions{grid-column:1/-1}.chapter-row{grid-template-columns:1fr 70px 70px}.chapter-row button{grid-column:1/-1}.section-head{align-items:start;flex-direction:column}.section-head input{width:100%}}
    </style>
</head>
<body>
    <div class="shell">
        <nav><div class="crumbs"><a href="/admin">BACK2ADMIN</a> &nbsp;|&nbsp; <a href="/admin/learningcenter">Learning Center</a></div><a href="/english/reading" target="_blank">打开孩子页面 ↗</a></nav>
        <header><div><span class="kicker">Book reading / admin</span><h1>阅读管理</h1></div><p>上传英文书 PDF，检查系统识别出的章节，再发布给孩子。每次问答和理解评估都保留在后台。</p></header>
        <div class="tabs"><button id="books-tab" class="tab active" onclick="showView('books')">书籍与章节</button><button id="reports-tab" class="tab" onclick="showView('reports')">阅读记录</button></div>
        <div id="status" class="status-line" role="status"></div>

        <main id="books-view">
            <section class="panel upload">
                <div class="upload-drop"><div><strong id="pdf-name">选择一本 PDF</strong><p>PDF · MAX 80MB<br>系统会先读取目录和章节标题</p><button class="button" type="button" onclick="document.getElementById('pdf-file').click()">选择文件</button></div></div>
                <form id="upload-form" class="form">
                    <input id="pdf-file" class="file" type="file" accept="application/pdf" required>
                    <input id="cover-file" class="file" type="file" accept="image/jpeg,image/png,image/webp">
                    <div class="field full"><label>书名</label><input id="new-title" maxlength="160" required placeholder="The Wild Robot"></div>
                    <div class="field"><label>作者</label><input id="new-author" maxlength="120" placeholder="Peter Brown"></div>
                    <div class="field"><label>适读年龄 / 年级</label><input id="new-age" maxlength="80" placeholder="Age 9–12 / Grade 5"></div>
                    <div class="field"><label>语言</label><input id="new-language" maxlength="40" value="English"></div>
                    <div class="field"><label>封面（可选）</label><button class="button" type="button" onclick="document.getElementById('cover-file').click()">选择封面</button><span id="cover-name" class="hint"></span></div>
                    <div class="field full"><label>给孩子的介绍</label><textarea id="new-description" maxlength="1200" placeholder="这本书讲了什么，为什么值得读？"></textarea></div>
                    <div class="field full"><div class="actions"><button id="upload-button" class="button primary" type="submit" disabled>上传并识别章节 →</button><span class="hint">上传完成后仍是草稿，请先核对章节再发布。</span></div></div>
                </form>
            </section>
            <div class="section-head"><h2>书架</h2><input id="book-search" placeholder="搜索书名或作者" oninput="renderBooks()"></div>
            <section id="book-list" class="books"><div class="empty">正在读取书架…</div></section>
        </main>

        <main id="reports-view" hidden>
            <div class="section-head"><h2>每次阅读</h2><span id="session-count" class="hint"></span></div>
            <section class="sessions"><div id="session-list" class="session-list"></div><article id="report" class="report"><div class="empty">选择左侧的一次阅读，查看完整问答和评估。</div></article></section>
        </main>
    </div>

    <dialog id="book-dialog">
        <div class="modal-head"><h2 id="edit-heading">编辑书籍</h2><button class="button" onclick="document.getElementById('book-dialog').close()">关闭</button></div>
        <div class="modal-body">
            <div id="ocr-warning" class="warning" hidden>这份 PDF 没有可读取的文字层，当前不能发布。请换用可选择文字的 PDF。</div>
            <div class="edit-grid"><div class="edit-fields"><div class="field full"><label>书名</label><input id="edit-title"></div><div class="field"><label>作者</label><input id="edit-author"></div><div class="field"><label>适读年龄 / 年级</label><input id="edit-age"></div><div class="field"><label>语言</label><input id="edit-language"></div><div class="field full"><label>介绍</label><textarea id="edit-description"></textarea></div><div class="field full"><div class="actions"><button class="button primary" onclick="saveBook()">保存资料</button><button id="publish-button" class="button blue" onclick="setBookStatus('published')">发布给孩子</button><button id="archive-button" class="button danger" onclick="setBookStatus('archived')">归档</button></div></div></div><aside class="cover-box"><img id="edit-cover" alt="书籍封面"><input id="edit-cover-file" class="file" type="file" accept="image/jpeg,image/png,image/webp"><button class="button" style="width:100%;margin-top:8px" onclick="document.getElementById('edit-cover-file').click()">更换封面</button></aside></div>
            <div class="chapters-head"><div><h3 style="margin:0">章节目录</h3><p class="hint">页码按 PDF 实际页数计算。请确认章节不重叠。</p></div><div class="actions"><button id="redetect-button" class="button blue" onclick="redetectChapters()">用线上模型重新识别</button><button class="button" onclick="addChapter()">+ 添加章节</button></div></div>
            <div id="chapter-list"></div><div class="actions" style="margin-top:12px"><button class="button primary" onclick="saveChapters()">保存章节</button><span id="chapter-stats" class="hint"></span></div>
        </div>
    </dialog>
    <script>
        let books=[],sessions=[],editingBook=null,selectedSession=null;
        function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
        function setStatus(message,type=''){const el=document.getElementById('status');el.textContent=message;el.className=`status-line ${type}`;if(message)window.scrollTo({top:0,behavior:'smooth'})}
        async function api(path,options={}){const response=await fetch(path,{cache:'no-store',...options});const data=await response.json().catch(()=>({}));if(response.status===401){location.href=`/admin?next=${encodeURIComponent('/admin/learningcenter/reading')}`;throw new Error('需要重新登录')};if(!response.ok)throw new Error(data.detail||`请求失败（${response.status}）`);return data}
        function showView(name){document.getElementById('books-view').hidden=name!=='books';document.getElementById('reports-view').hidden=name!=='reports';document.getElementById('books-tab').classList.toggle('active',name==='books');document.getElementById('reports-tab').classList.toggle('active',name==='reports');if(name==='reports')loadSessions()}
        document.getElementById('pdf-file').addEventListener('change',event=>{const file=event.target.files[0];document.getElementById('pdf-name').textContent=file?file.name:'选择一本 PDF';document.getElementById('upload-button').disabled=!file;if(file&&!document.getElementById('new-title').value)document.getElementById('new-title').value=file.name.replace(/\.pdf$/i,'')});
        document.getElementById('cover-file').addEventListener('change',event=>{document.getElementById('cover-name').textContent=event.target.files[0]?.name||''});
        document.getElementById('upload-form').addEventListener('submit',async event=>{event.preventDefault();const pdf=document.getElementById('pdf-file').files[0];if(!pdf)return;const button=document.getElementById('upload-button');button.disabled=true;button.textContent='正在识别目录…';setStatus('PDF 正在上传和识别，较长的书可能需要一点时间。');const query=new URLSearchParams({title:document.getElementById('new-title').value.trim(),author:document.getElementById('new-author').value.trim(),description:document.getElementById('new-description').value.trim(),age_level:document.getElementById('new-age').value.trim(),language:document.getElementById('new-language').value.trim()||'English'});try{const book=await api(`/api/admin/reading/books?${query}`,{method:'POST',headers:{'Content-Type':pdf.type||'application/pdf'},body:pdf});const cover=document.getElementById('cover-file').files[0];if(cover)await api(`/api/admin/reading/books/${book.id}/cover`,{method:'POST',headers:{'Content-Type':cover.type},body:cover});event.target.reset();document.getElementById('new-language').value='English';document.getElementById('pdf-name').textContent='选择一本 PDF';document.getElementById('cover-name').textContent='';setStatus(`《${book.title}》已上传为草稿，请核对识别出的章节。`,'success');await loadBooks();openBook(book.id)}catch(error){setStatus(error.message,'error')}finally{button.textContent='上传并识别章节 →';button.disabled=!document.getElementById('pdf-file').files[0]}});
        async function loadBooks(){try{const data=await api('/api/admin/reading/books');books=data.books||[];renderBooks()}catch(error){document.getElementById('book-list').innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`}}
        function renderBooks(){const term=document.getElementById('book-search').value.trim().toLowerCase();const filtered=books.filter(book=>`${book.title} ${book.author}`.toLowerCase().includes(term));document.getElementById('book-list').innerHTML=filtered.length?filtered.map(book=>{const image=book.has_cover?`<img class="thumb" src="/api/admin/reading/books/${book.id}/cover" alt="">`:`<div class="thumb">${escapeHtml(book.title.slice(0,1))}</div>`;return `<article class="book">${image}<div><h3>${escapeHtml(book.title)} <span class="badge ${book.status}">${book.status}</span></h3><p>${escapeHtml(book.author||'未填写作者')} · ${book.page_count} 页 · ${book.chapters.length} 个章节 · ${book.extraction_status==='needs_ocr'?'需要文字版 PDF':'文字已读取'}</p></div><div class="actions"><button class="button" onclick="openBook('${book.id}')">编辑 / 目录</button></div></article>`}).join(''):'<div class="empty">没有找到书籍。</div>'}
        function fillBook(book){editingBook=book;document.getElementById('edit-heading').textContent=`编辑《${book.title}》`;['title','author','description','age_level','language'].forEach(key=>document.getElementById(`edit-${key==='age_level'?'age':key}`).value=book[key]||'');const warning=document.getElementById('ocr-warning');warning.hidden=!['needs_ocr','chapter_review'].includes(book.extraction_status);warning.textContent=book.extraction_status==='needs_ocr'?'这份 PDF 没有可读取的文字层，当前不能发布。请换用可选择文字的 PDF。':'目录尚未自动识别。可以点击“用线上模型重新识别”，也可以人工编辑并保存章节。';const cover=document.getElementById('edit-cover');cover.src=book.has_cover?`/api/admin/reading/books/${book.id}/cover`:'';cover.alt=book.has_cover?`《${book.title}》封面`:'尚未上传封面';document.getElementById('publish-button').textContent=book.status==='published'?'已发布（点击保留）':'发布给孩子';document.getElementById('archive-button').hidden=book.status==='archived';renderChapterRows(book.chapters);document.getElementById('book-dialog').showModal()}
        async function openBook(id){try{fillBook(await api(`/api/admin/reading/books/${id}`))}catch(error){setStatus(error.message,'error')}}
        function renderChapterRows(chapters){document.getElementById('chapter-list').innerHTML=chapters.map((ch,i)=>`<div class="chapter-row" data-id="${escapeHtml(ch.id||'')}"><input class="chapter-title" value="${escapeHtml(ch.title)}" aria-label="章节名称 ${i+1}"><input class="chapter-start" type="number" min="1" max="${editingBook.page_count}" value="${ch.start_page}" aria-label="开始页"><input class="chapter-end" type="number" min="1" max="${editingBook.page_count}" value="${ch.end_page}" aria-label="结束页"><button class="button danger" onclick="this.parentElement.remove();updateChapterStats()">移除</button></div>`).join('');updateChapterStats()}
        function addChapter(){const rows=[...document.querySelectorAll('.chapter-row')];const lastEnd=Number(rows.at(-1)?.querySelector('.chapter-end').value||0);document.getElementById('chapter-list').insertAdjacentHTML('beforeend',`<div class="chapter-row" data-id=""><input class="chapter-title" value="Chapter ${rows.length+1}"><input class="chapter-start" type="number" min="1" max="${editingBook.page_count}" value="${Math.min(editingBook.page_count,lastEnd+1)}"><input class="chapter-end" type="number" min="1" max="${editingBook.page_count}" value="${editingBook.page_count}"><button class="button danger" onclick="this.parentElement.remove();updateChapterStats()">移除</button></div>`);updateChapterStats()}
        function updateChapterStats(){document.getElementById('chapter-stats').textContent=`${document.querySelectorAll('.chapter-row').length} 个章节 · PDF 共 ${editingBook?.page_count||0} 页`}
        async function saveBook(){const payload={title:document.getElementById('edit-title').value.trim(),author:document.getElementById('edit-author').value.trim(),description:document.getElementById('edit-description').value.trim(),age_level:document.getElementById('edit-age').value.trim(),language:document.getElementById('edit-language').value.trim()};try{const updated=await api(`/api/admin/reading/books/${editingBook.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});setStatus('书籍资料已保存。','success');await loadBooks();fillBook(updated)}catch(error){setStatus(error.message,'error')}}
        async function saveChapters(){const chapters=[...document.querySelectorAll('.chapter-row')].map(row=>({id:row.dataset.id||null,title:row.querySelector('.chapter-title').value.trim(),start_page:Number(row.querySelector('.chapter-start').value),end_page:Number(row.querySelector('.chapter-end').value)}));try{const updated=await api(`/api/admin/reading/books/${editingBook.id}/chapters`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({chapters})});setStatus('章节目录已保存，并重新读取了对应页内容。','success');await loadBooks();fillBook(updated)}catch(error){setStatus(error.message,'error')}}
        async function redetectChapters(){if(!editingBook)return;const button=document.getElementById('redetect-button');button.disabled=true;button.textContent='线上模型识别中…';try{const updated=await api(`/api/admin/reading/books/${editingBook.id}/redetect-chapters`,{method:'POST'});setStatus(`已重新识别出 ${updated.chapters.length} 个章节；书籍已转为草稿，请核对后重新发布。`,'success');await loadBooks();fillBook(updated)}catch(error){setStatus(error.message,'error')}finally{button.disabled=false;button.textContent='用线上模型重新识别'}}
        async function setBookStatus(status){if(status==='archived'&&!confirm('归档后孩子将看不到这本书，历史阅读记录仍会保留。确定吗？'))return;try{const updated=await api(`/api/admin/reading/books/${editingBook.id}/status`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});setStatus(status==='published'?'书籍已发布到孩子的 Book Reading 页面。':'书籍已归档。','success');document.getElementById('book-dialog').close();await loadBooks()}catch(error){setStatus(error.message,'error')}}
        document.getElementById('edit-cover-file').addEventListener('change',async event=>{const file=event.target.files[0];if(!file||!editingBook)return;try{const updated=await api(`/api/admin/reading/books/${editingBook.id}/cover`,{method:'POST',headers:{'Content-Type':file.type},body:file});setStatus('封面已更新。','success');await loadBooks();fillBook(updated)}catch(error){setStatus(error.message,'error')}});
        async function loadSessions(){try{const data=await api('/api/admin/reading/sessions');sessions=data.sessions||[];document.getElementById('session-count').textContent=`共 ${sessions.length} 次`;renderSessionList();if(sessions.length&&!selectedSession)showSession(sessions[0].id)}catch(error){document.getElementById('session-list').innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`}}
        function renderSessionList(){document.getElementById('session-list').innerHTML=sessions.length?sessions.map(item=>`<button class="session-item ${selectedSession?.id===item.id?'active':''}" onclick="showSession('${item.id}')"><strong>${escapeHtml(item.book?.title||'未知书籍')}</strong><span>${new Date(item.created_at).toLocaleString()} · ${item.status==='completed'?'已完成':'进行中'} · ${levelLabel(item.overall_level)}</span></button>`).join(''):'<div class="empty">还没有阅读记录。</div>'}
        function levelLabel(level){return {clear:'理解清楚',mostly_clear:'大致理解',needs_support:'需要再帮助'}[level]||'暂无评估'}
        async function showSession(id){try{selectedSession=await api(`/api/admin/reading/sessions/${id}`);renderSessionList();const s=selectedSession,e=s.evaluation||{};document.getElementById('report').innerHTML=`<h3>${escapeHtml(s.book?.title||'阅读记录')}</h3><p class="hint">${new Date(s.created_at).toLocaleString()} · ${s.questions.filter(q=>q.answered_at).length}/${s.question_count} 题已完成 · ${levelLabel(s.overall_level)}</p>${s.parent_summary?`<div class="summary"><strong>整体评估</strong><br>${escapeHtml(s.parent_summary)}</div>`:''}${(e.strengths||[]).length?`<p><strong>优势：</strong>${e.strengths.map(escapeHtml).join('；')}</p>`:''}${(e.review_next||[]).length?`<p><strong>需要回看：</strong>${e.review_next.map(escapeHtml).join('；')}</p>`:''}${s.questions.map((q,i)=>`<section class="qa"><h4>${i+1}. ${escapeHtml(q.question_text)}</h4><p class="answer"><strong>孩子回答：</strong>${escapeHtml(q.child_answer||'尚未回答')} ${q.input_mode==='voice'?'<span class="badge">语音转文字</span>':''}</p>${q.feedback?`<p><strong>即时反馈：</strong>${escapeHtml(q.feedback)}</p>`:''}${q.follow_up_question?`<p><strong>追问：</strong>${escapeHtml(q.follow_up_question)}<br><strong>补充回答：</strong>${escapeHtml(q.follow_up_answer||'尚未回答')}<br>${escapeHtml(q.follow_up_feedback||'')}</p>`:''}<p class="parent-note"><strong>家长备注：</strong>${escapeHtml(q.parent_note||'暂无')} · ${levelLabel(q.understanding_level)}</p><details><summary>参考与证据</summary><p>${escapeHtml(q.reference_answer||'')}</p><pre style="white-space:pre-wrap">${escapeHtml(JSON.stringify(q.evidence||[],null,2))}</pre></details></section>`).join('')}`;renderSessionList()}catch(error){setStatus(error.message,'error')}}
        loadBooks();
    </script>
</body>
</html>
