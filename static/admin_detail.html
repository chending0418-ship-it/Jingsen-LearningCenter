<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词库详情</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg-main: #F8F9FB; --accent: #4F46E5; }
        body { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; background: var(--bg-main); }
        .card { border: 1px solid #E5E7EB; border-radius: 16px; background: #fff; }
    </style>
    <link rel="stylesheet" href="/static/admin_learning_theme.css">
</head>
<body class="learning-admin tailwind-admin library-detail-page min-h-screen p-4 md:p-8">
    <div id="notice" class="hidden fixed right-4 top-4 z-50 px-4 py-3 rounded-xl text-sm font-medium shadow-lg"></div>

    <div class="max-w-4xl mx-auto space-y-4">
        <header>
            <nav class="admin-context-line" aria-label="Admin breadcrumb">
                <a href="/admin">BACK2ADMIN</a><span aria-hidden="true">|</span><a href="/admin/learningcenter">Learning Center</a>
            </nav>
            <h1 class="text-3xl font-bold text-gray-900">词库详情 / 编辑</h1>
        </header>

        <div id="missing" class="card p-5 hidden text-red-600">缺少词库 id，请从列表页进入。</div>

        <div id="panel" class="card p-5 space-y-4 hidden">
            <input id="detail-id" type="hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-gray-600 mb-1">学科</label>
                    <input id="detail-subject" type="text" disabled class="w-full p-2.5 border border-gray-200 rounded-xl bg-gray-50 text-gray-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">启用状态</label>
                    <div class="flex gap-2">
                        <input id="detail-enabled-text" type="text" disabled class="flex-1 p-2.5 border border-gray-200 rounded-xl bg-gray-50 text-gray-500">
                        <button onclick="toggleStatus()" id="toggle-btn" class="px-4 py-2.5 rounded-xl bg-amber-500 text-white hover:opacity-90">停用</button>
                        <button onclick="toggleArchive()" id="archive-btn" class="px-4 py-2.5 rounded-xl border border-amber-300 text-amber-700 hover:bg-amber-50">归档</button>
                    </div>
                    <p class="mt-2 text-xs text-gray-500">归档会保留全部词条，但不再出现在孩子的出题词库选项中。</p>
                </div>
            </div>

            <div>
                <label class="block text-sm text-gray-600 mb-1">词库名称</label>
                <input id="detail-name" type="text" class="w-full p-2.5 border border-gray-200 rounded-xl">
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">词库类型</label>
                <select id="detail-type" class="w-full p-2.5 border border-gray-200 rounded-xl"></select>
                <p id="english-type-note" class="hidden mt-2 text-sm text-emerald-700 bg-emerald-50 border border-emerald-100 rounded-xl px-3 py-2">英语词库为通用词库，可用于 Word Palace 的所有练习类型。</p>
            </div>
            <button id="save-meta-btn" onclick="saveMeta()" class="w-full py-2.5 rounded-xl border border-gray-300 hover:bg-gray-50">保存元信息</button>

            <div>
                <label class="block text-sm text-gray-600 mb-1">词条（每行一个）</label>
                <textarea id="detail-items" rows="12" class="w-full p-2.5 border border-gray-200 rounded-xl"></textarea>
            </div>
            <button id="save-items-btn" onclick="saveItems()" class="w-full py-2.5 rounded-xl bg-[var(--accent)] text-white font-semibold hover:opacity-90">保存词条</button>
        </div>
    </div>

    <script>
        const BASE_PATH = window.location.pathname.startsWith('/learningcenter') ? '/learningcenter' : '';
        const withBasePath = (path) => `${BASE_PATH}${path}`;
        const rawFetch = window.fetch.bind(window);
        window.fetch = (input, init) => {
            if (typeof input === 'string' && input.startsWith('/') && !input.startsWith('//')) {
                return rawFetch(withBasePath(input), init);
            }
            return rawFetch(input, init);
        };

        let current = null;

        const CHINESE_TYPES = [
            { value: '', label: '无指定类型' },
            { value: 'word_discrim', label: '词语辨析' },
            { value: 'conj_fill', label: '关联词填空' },
            { value: 'idiom_fill', label: '成语填空' }
        ];
        const ENGLISH_TYPES = [
            { value: '', label: '通用' }
        ];

        function showNotice(type, message) {
            const el = document.getElementById('notice');
            el.className = `fixed right-4 top-4 z-50 px-4 py-3 rounded-xl text-sm font-medium shadow-lg ${type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-700 border border-red-200'}`;
            el.textContent = message;
            el.classList.remove('hidden');
            clearTimeout(window.__noticeTimer__);
            window.__noticeTimer__ = setTimeout(() => el.classList.add('hidden'), 2800);
        }

        function fillSelect(subject, selected = '') {
            const isEnglish = subject === 'english';
            const opts = isEnglish ? ENGLISH_TYPES : CHINESE_TYPES;
            const target = document.getElementById('detail-type');
            target.innerHTML = opts.map(opt => `<option value="${opt.value}">${opt.label}</option>`).join('');
            target.value = isEnglish ? '' : (selected || '');
            target.classList.toggle('hidden', isEnglish);
            document.getElementById('english-type-note').classList.toggle('hidden', !isEnglish);
        }

        function updateStatusUI() {
            const enabled = !!current.enabled;
            const archived = !!current.archived;
            document.getElementById('detail-enabled-text').value = archived ? '已归档' : enabled ? '启用中' : '已停用';
            const btn = document.getElementById('toggle-btn');
            btn.textContent = enabled ? '停用' : '启用';
            btn.className = `px-4 py-2.5 rounded-xl text-white hover:opacity-90 ${enabled ? 'bg-amber-500' : 'bg-emerald-600'}`;
            btn.disabled = archived;
            btn.classList.toggle('opacity-40', archived);
            btn.classList.toggle('cursor-not-allowed', archived);
            const archiveBtn = document.getElementById('archive-btn');
            archiveBtn.textContent = archived ? '取消归档' : '归档';
            archiveBtn.className = `px-4 py-2.5 rounded-xl hover:opacity-90 ${archived ? 'bg-indigo-600 text-white' : 'border border-amber-300 text-amber-700 hover:bg-amber-50'}`;
            ['detail-name', 'detail-type', 'detail-items', 'save-meta-btn', 'save-items-btn'].forEach(id => {
                const element = document.getElementById(id);
                element.disabled = archived;
                element.classList.toggle('opacity-50', archived);
                element.classList.toggle('cursor-not-allowed', archived);
            });
        }

        async function loadDetail() {
            const id = new URLSearchParams(location.search).get('id');
            if (!id) {
                document.getElementById('missing').classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch(`/api/admin/libraries/${id}`);
                const data = await res.json();
                if (!res.ok) return showNotice('error', `加载详情失败：${data.detail || '未知错误'}`);

                current = data;
                document.getElementById('panel').classList.remove('hidden');
                document.getElementById('detail-id').value = data.id;
                document.getElementById('detail-subject').value = data.subject === 'chinese' ? '语文' : '英语';
                document.getElementById('detail-name').value = data.name;
                fillSelect(data.subject, data.library_type || '');
                document.getElementById('detail-items').value = (data.items || []).join('\n');
                updateStatusUI();
            } catch (e) {
                showNotice('error', `加载详情失败：${e.message || '网络错误'}`);
            }
        }

        async function toggleStatus() {
            if (current.archived) return showNotice('error', '请先取消归档，再重新启用词库');
            try {
                const res = await fetch(`/api/admin/libraries/${current.id}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled: !current.enabled })
                });
                const data = await res.json();
                if (!res.ok) return showNotice('error', `状态更新失败：${data.detail || '未知错误'}`);
                current = data;
                updateStatusUI();
                showNotice('success', '状态更新成功');
            } catch (e) {
                showNotice('error', `状态更新失败：${e.message || '网络错误'}`);
            }
        }

        async function toggleArchive() {
            const nextArchived = !current.archived;
            if (nextArchived && !window.confirm(`确认归档“${current.name}”吗？完整内容会移入独立归档文件，并停止用于生成题目。`)) return;
            try {
                const res = await fetch(`/api/admin/libraries/${current.id}/archive`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ archived: nextArchived })
                });
                const data = await res.json();
                if (!res.ok) return showNotice('error', `归档状态更新失败：${data.detail || '未知错误'}`);
                current = data;
                updateStatusUI();
                showNotice('success', nextArchived ? '词库已归档，不再参与出题' : '已取消归档；需要时请重新启用');
            } catch (e) {
                showNotice('error', `归档状态更新失败：${e.message || '网络错误'}`);
            }
        }

        async function saveMeta() {
            const name = document.getElementById('detail-name').value.trim();
            const library_type = current.subject === 'english' ? null : (document.getElementById('detail-type').value || null);
            if (!name) return showNotice('error', '保存失败：名称不能为空');

            try {
                const res = await fetch(`/api/admin/libraries/${current.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, library_type })
                });
                const data = await res.json();
                if (!res.ok) return showNotice('error', `保存失败：${data.detail || '未知错误'}`);
                await loadDetail();
                showNotice('success', '元信息已保存');
            } catch (e) {
                showNotice('error', `保存失败：${e.message || '网络错误'}`);
            }
        }

        async function saveItems() {
            const items = document.getElementById('detail-items').value.split('\n').map(x => x.trim()).filter(Boolean);
            if (!items.length) return showNotice('error', '保存失败：请至少保留 1 条词条');

            try {
                const res = await fetch(`/api/admin/libraries/${current.id}/items`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items })
                });
                const data = await res.json();
                if (!res.ok) return showNotice('error', `保存失败：${data.detail || '未知错误'}`);
                await loadDetail();
                showNotice('success', '词条已保存');
            } catch (e) {
                showNotice('error', `保存失败：${e.message || '网络错误'}`);
            }
        }

        loadDetail();
    </script>
</body>
</html>
