<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills 管理 - Jingsen 学习中心</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; background: #F8F9FB; }
        .card { border: 1px solid #E5E7EB; border-radius: 16px; background: #fff; }
        .skills-table { table-layout: fixed; min-width: 1180px; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .status-pill { display: inline-flex; width: 64px; height: 28px; align-items: center; justify-content: center; white-space: nowrap; }
        .action-btn { display: inline-flex; width: 64px; height: 32px; align-items: center; justify-content: center; white-space: nowrap; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div id="notice" class="hidden fixed right-4 top-4 z-50 px-4 py-3 rounded-xl text-sm font-medium shadow-lg"></div>
    <div class="max-w-7xl mx-auto space-y-4">
        <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
            <div>
                <button onclick="location.href=withBasePath('/admin')" class="text-gray-500 hover:text-gray-700 flex items-center gap-2 mb-2">← 返回词库后台</button>
                <h1 class="text-3xl font-bold text-gray-900">Skills 知识点管理</h1>
                <p class="text-gray-500 mt-1">查看和维护 MAP / Word Palace 的 Grade ｜ Topic ｜ Skill ｜ Detail 数据。</p>
            </div>
            <button onclick="loadSkills()" class="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-semibold hover:opacity-90">刷新</button>
        </header>

        <div class="card p-4 md:p-5">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-3 md:items-end">
                <div>
                    <label class="block text-sm text-gray-600 mb-1">入口</label>
                    <select id="filter-section" onchange="loadSkills()" class="w-full p-2.5 border border-gray-200 rounded-xl bg-white">
                        <option value="language_arts">MAP Language Arts</option>
                        <option value="reading">MAP Reading</option>
                        <option value="vocabulary_skills">Word Vocabulary Skills</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">Grade</label>
                    <select id="filter-grade" onchange="syncFiltersFromRows(); renderRows();" class="w-full p-2.5 border border-gray-200 rounded-xl bg-white"></select>
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">Topic</label>
                    <select id="filter-topic" onchange="syncFiltersFromRows(); renderRows();" class="w-full p-2.5 border border-gray-200 rounded-xl bg-white"></select>
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">Skill</label>
                    <select id="filter-skill" onchange="renderRows()" class="w-full p-2.5 border border-gray-200 rounded-xl bg-white"></select>
                </div>
                <label class="inline-flex items-center gap-2 text-sm text-gray-700">
                    <input id="filter-enabled-only" type="checkbox" onchange="loadSkills()" class="w-4 h-4">
                    只看启用
                </label>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-3" id="summary-cards"></div>

        <div class="card overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead class="bg-gray-50 text-gray-500">
                        <tr>
                            <th class="text-left p-3">Grade</th>
                            <th class="text-left p-3">Topic</th>
                            <th class="text-left p-3">Skill</th>
                            <th class="text-left p-3">Detail</th>
                            <th class="text-left p-3">状态</th>
                            <th class="text-left p-3">操作</th>
                        </tr>
                    </thead>
                    <tbody id="skills-tbody" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const BASE_PATH = window.location.pathname.startsWith('/learningcenter') ? '/learningcenter' : '';
        const withBasePath = (path) => `${BASE_PATH}${path}`;
        const rawFetch = window.fetch.bind(window);
        window.fetch = (input, init) => {
            if (typeof input === 'string' && input.startsWith('/') && !input.startsWith('//')) return rawFetch(withBasePath(input), init);
            return rawFetch(input, init);
        };

        let rows = [];

        function showNotice(type, message) {
            const el = document.getElementById('notice');
            el.className = `fixed right-4 top-4 z-50 px-4 py-3 rounded-xl text-sm font-medium shadow-lg ${type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-700 border border-red-200'}`;
            el.textContent = message;
            el.classList.remove('hidden');
            clearTimeout(window.__noticeTimer__);
            window.__noticeTimer__ = setTimeout(() => el.classList.add('hidden'), 2600);
        }

        function sectionToModule(section) {
            return section === 'vocabulary_skills' ? 'word_palace' : 'map_test';
        }

        async function loadSkills() {
            const section = document.getElementById('filter-section').value;
            const query = new URLSearchParams({ module: sectionToModule(section), section });
            if (document.getElementById('filter-enabled-only').checked) query.set('enabled_only', 'true');
            const res = await fetch(`/api/skills?${query.toString()}`);
            const data = await res.json();
            if (!res.ok) return showNotice('error', data.detail || '加载 Skills 失败');
            rows = data.skills || [];
            resetSelects();
            syncFiltersFromRows();
            renderSummary();
            renderRows();
        }

        function resetSelects() {
            document.getElementById('filter-grade').value = '';
            document.getElementById('filter-topic').value = '';
            document.getElementById('filter-skill').value = '';
        }

        function fillSelect(id, values, label) {
            const el = document.getElementById(id);
            const prev = el.value;
            el.innerHTML = `<option value="">${label}</option>` + values.map(v => `<option value="${escapeAttr(v)}">${escapeHtml(v)}</option>`).join('');
            if (values.includes(prev)) el.value = prev;
        }

        function syncFiltersFromRows() {
            const grade = document.getElementById('filter-grade').value;
            const topic = document.getElementById('filter-topic').value;
            const grades = unique(rows.map(r => r.grade));
            const topics = unique(rows.filter(r => !grade || r.grade === grade).map(r => r.topic));
            const skills = unique(rows.filter(r => (!grade || r.grade === grade) && (!topic || r.topic === topic)).map(r => r.skill));
            fillSelect('filter-grade', grades, '全部年级');
            fillSelect('filter-topic', topics, '全部 Topic');
            fillSelect('filter-skill', skills, '全部 Skill');
        }

        function filteredRows() {
            const grade = document.getElementById('filter-grade').value;
            const topic = document.getElementById('filter-topic').value;
            const skill = document.getElementById('filter-skill').value;
            return rows.filter(r => (!grade || r.grade === grade) && (!topic || r.topic === topic) && (!skill || r.skill === skill));
        }

        function renderSummary() {
            const grades = unique(rows.map(r => r.grade)).length;
            const topics = unique(rows.map(r => r.topic)).length;
            const skills = unique(rows.map(r => `${r.grade}|${r.topic}|${r.skill}`)).length;
            const enabled = rows.filter(r => r.enabled).length;
            document.getElementById('summary-cards').innerHTML = [
                ['Total Details', rows.length],
                ['Grades', grades],
                ['Skills', skills],
                ['Enabled', enabled]
            ].map(([label, value]) => `<div class="card p-4"><div class="text-sm text-gray-500">${label}</div><div class="text-2xl font-bold mt-1">${value}</div></div>`).join('');
        }

        function renderRows() {
            const tbody = document.getElementById('skills-tbody');
            const list = filteredRows();
            if (!list.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-gray-400">暂无 Skills</td></tr>';
                return;
            }
            tbody.innerHTML = list.slice(0, 500).map(row => `
                <tr class="h-[76px] align-middle">
                    <td class="p-3 text-gray-700 whitespace-nowrap align-middle">${escapeHtml(row.grade)}</td>
                    <td class="p-3 text-gray-700 align-middle"><div class="line-clamp-2 leading-5">${escapeHtml(row.topic)}</div></td>
                    <td class="p-3 font-medium text-gray-900 align-middle"><div class="line-clamp-2 leading-5">${escapeHtml(row.skill)}</div></td>
                    <td class="p-3 text-gray-600 align-middle"><div class="line-clamp-2 leading-5">${escapeHtml(row.detail)}</div></td>
                    <td class="p-3 text-center align-middle"><span class="status-pill rounded-full text-xs font-bold ${row.enabled ? 'bg-emerald-100 text-emerald-700' : 'bg-gray-100 text-gray-600'}">${row.enabled ? '启用' : '停用'}</span></td>
                    <td class="p-3 text-center align-middle"><button onclick="toggleSkill('${escapeAttr(row.id)}', ${!row.enabled})" class="action-btn rounded-lg ${row.enabled ? 'bg-amber-500' : 'bg-emerald-600'} text-white text-sm font-semibold">${row.enabled ? '停用' : '启用'}</button></td>
                </tr>
            `).join('');
        }

        async function toggleSkill(id, enabled) {
            const res = await fetch(`/api/skills/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled })
            });
            const data = await res.json();
            if (!res.ok) return showNotice('error', data.detail || '更新失败');
            showNotice('success', '更新成功');
            await loadSkills();
        }

        function unique(values) {
            return [...new Set(values.filter(Boolean))].sort();
        }
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
        }
        function escapeAttr(value) {
            return String(value ?? '').replace(/[\\'"\n\r]/g, ch => ({'\\':'\\\\',"'":"\\'",'"':'&quot;','\n':' ','\r':' '}[ch]));
        }

        loadSkills();
    </script>
</body>
</html>
