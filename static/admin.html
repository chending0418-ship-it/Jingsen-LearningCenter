<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Center 管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg-main: #F8F9FB; --accent: #4F46E5; }
        body { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; background: var(--bg-main); }
        .card { border: 1px solid #E5E7EB; border-radius: 16px; background: #fff; }
    </style>
    <link rel="stylesheet" href="/static/admin_learning_theme.css">
</head>
<body class="learning-admin tailwind-admin learning-admin-home min-h-screen p-4 md:p-8">
    <div id="notice" class="hidden fixed right-4 top-4 z-50 px-4 py-3 rounded-xl text-sm font-medium shadow-lg"></div>

    <div class="max-w-7xl mx-auto space-y-4">
        <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
            <div>
                <nav class="admin-context-line" aria-label="Admin breadcrumb">
                    <a href="/admin">BACK2ADMIN</a><span aria-hidden="true">|</span><a href="/admin/learningcenter">Learning Center</a>
                </nav>
                <h1 class="text-3xl font-bold text-gray-900">Learning Center 管理</h1>
                <p class="text-gray-500 mt-1">管理词库、Skills、Todo 与全站 AI 模型。</p>
            </div>
        </header>

        <section class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-4">
            <button class="card p-5 text-left border-2 border-indigo-500 bg-indigo-50/60">
                <div class="text-xs font-bold text-indigo-600 uppercase tracking-[0.16em]">当前页面</div>
                <h2 class="text-2xl font-bold text-gray-900 mt-2">词库管理</h2>
                <p class="text-gray-500 mt-2">维护 Word Palace / 中文模块使用的词库、词条、启用状态。</p>
            </button>
            <button onclick="location.href='/admin/learningcenter/skills'" class="card p-5 text-left hover:border-blue-400 hover:bg-blue-50/50 transition-colors">
                <div class="text-xs font-bold text-blue-600 uppercase tracking-[0.16em]">Skills</div>
                <h2 class="text-2xl font-bold text-gray-900 mt-2">Skills 管理</h2>
                <p class="text-gray-500 mt-2">维护 MAP Language Arts / Reading / Vocabulary Skills 的 Grade ｜ Topic ｜ Skill ｜ Detail。</p>
            </button>
            <button onclick="location.href='/admin/learningcenter/todo'" class="card p-5 text-left hover:border-amber-400 hover:bg-amber-50/60 transition-colors">
                <div class="text-xs font-bold text-amber-600 uppercase tracking-[0.16em]">Learning Todo</div>
                <h2 class="text-2xl font-bold text-gray-900 mt-2">Todo 管理</h2>
                <p class="text-gray-500 mt-2">安排学习任务，查看日、周、月进度与完成统计。</p>
            </button>
            <button onclick="location.href='/admin/learningcenter/models'" class="card p-5 text-left hover:border-violet-400 hover:bg-violet-50/60 transition-colors">
                <div class="text-xs font-bold text-violet-600 uppercase tracking-[0.16em]">AI Models</div>
                <h2 class="text-2xl font-bold text-gray-900 mt-2">模型选择</h2>
                <p class="text-gray-500 mt-2">读取当前 Key 可用模型，并设置所有出题模块的默认模型。</p>
            </button>
            <button onclick="location.href='/admin/learningcenter/reading'" class="card p-5 text-left hover:border-lime-500 hover:bg-lime-50/60 transition-colors">
                <div class="text-xs font-bold text-lime-700 uppercase tracking-[0.16em]">Book Reading</div>
                <h2 class="text-2xl font-bold text-gray-900 mt-2">阅读管理</h2>
                <p class="text-gray-500 mt-2">上传 PDF、检查章节、发布书籍，并查看孩子每次问答与理解评估。</p>
            </button>
        </section>

        <div class="library-action-bar" aria-label="词库操作">
            <div class="library-action-copy"><span>Library controls</span><strong>词库操作</strong></div>
            <div class="library-action-buttons">
                <button onclick="location.href='/admin/learningcenter/new'">新增词库</button>
                <button onclick="loadLibraries()">刷新词库</button>
            </div>
        </div>

        <div class="card p-4 md:p-5">
            <div class="flex flex-col md:flex-row gap-3 md:items-end">
                <div class="flex-1">
                    <label class="block text-sm text-gray-600 mb-1">学科筛选</label>
                    <select id="filter-subject" class="w-full p-2.5 border border-gray-200 rounded-xl bg-white">
                        <option value="">全部</option>
                        <option value="english">英语</option>
                        <option value="chinese">语文</option>
                    </select>
                </div>
                <label class="inline-flex items-center gap-2 text-sm text-gray-700">
                    <input id="filter-include-disabled" type="checkbox" checked class="w-4 h-4">
                    包含未启用词库
                </label>
                <label class="inline-flex items-center gap-2 text-sm text-gray-700">
                    <input id="filter-include-archived" type="checkbox" class="w-4 h-4">
                    显示已归档词库
                </label>
                <button onclick="loadLibraries()" class="px-4 py-2.5 rounded-xl border border-gray-300 text-gray-700 hover:bg-gray-50">查询</button>
            </div>
        </div>

        <div class="card p-0 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead class="bg-gray-50 text-gray-500">
                        <tr>
                            <th class="text-left p-3">词库名称</th>
                            <th class="text-left p-3">学科</th>
                            <th class="text-left p-3">类型</th>
                            <th class="text-left p-3">词条数</th>
                            <th class="text-left p-3">状态</th>
                            <th class="text-left p-3">操作</th>
                        </tr>
                    </thead>
                    <tbody id="library-tbody" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const BASE_PATH = window.location.pathname.startsWith('/learningcenter') ? '/learningcenter' : '';
        const withBasePath = (path) => `${BASE_PATH}${path}`;
        const rawFetch = window.fetch.bind(window);
        window.fetch = (input, init) => {
            if (typeof input === 'string' && input.startsWith('/') && !input.startsWith('//')) {
                return rawFetch(withBasePath(input), init);
            }
            return rawFetch(input, init);
        };

        function showNotice(type, message) {
            const el = document.getElementById('notice');
            el.className = `fixed right-4 top-4 z-50 px-4 py-3 rounded-xl text-sm font-medium shadow-lg ${type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-700 border border-red-200'}`;
            el.textContent = message;
            el.classList.remove('hidden');
            clearTimeout(window.__noticeTimer__);
            window.__noticeTimer__ = setTimeout(() => el.classList.add('hidden'), 2600);
        }

        function subjectLabel(value) {
            return value === 'chinese' ? '语文' : '英语';
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function typeLabel(type, subject) {
            if (subject === 'english') return '通用';
            const map = {
                word_discrim: '词语辨析',
                conj_fill: '关联词填空',
                idiom_fill: '成语填空'
            };
            return map[type] || '-';
        }

        async function toggleStatus(libraryId, enabled) {
            try {
                const res = await fetch(`/api/admin/libraries/${libraryId}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled })
                });
                const data = await res.json();
                if (!res.ok) return showNotice('error', `状态更新失败：${data.detail || '未知错误'}`);
                showNotice('success', '状态更新成功');
                await loadLibraries();
            } catch (e) {
                showNotice('error', `状态更新失败：${e.message || '网络错误'}`);
            }
        }

        async function toggleArchive(libraryId, archived) {
            const action = archived ? '归档' : '取消归档';
            if (archived && !window.confirm('确认归档该词库吗？完整内容会移入独立归档文件，并停止用于生成题目。')) return;
            try {
                const res = await fetch(`/api/admin/libraries/${libraryId}/archive`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ archived })
                });
                const data = await res.json();
                if (!res.ok) return showNotice('error', `${action}失败：${data.detail || '未知错误'}`);
                showNotice('success', archived ? '词库已归档，不再参与出题' : '已取消归档；需要时请重新启用');
                await loadLibraries();
            } catch (e) {
                showNotice('error', `${action}失败：${e.message || '网络错误'}`);
            }
        }

        async function loadLibraries() {
            const subject = document.getElementById('filter-subject').value;
            const includeDisabled = document.getElementById('filter-include-disabled').checked;
            const includeArchived = document.getElementById('filter-include-archived').checked;
            const query = new URLSearchParams();
            if (subject) query.set('subject', subject);
            query.set('include_disabled', includeDisabled ? 'true' : 'false');
            query.set('include_archived', includeArchived ? 'true' : 'false');

            try {
                const res = await fetch(`/api/admin/libraries?${query.toString()}`);
                const data = await res.json();
                if (!res.ok) {
                    showNotice('error', `加载词库失败：${data.detail || '未知错误'}`);
                    return;
                }

                const libraries = data.libraries || [];
                const tbody = document.getElementById('library-tbody');

                if (!libraries.length) {
                    tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-gray-400">暂无词库</td></tr>';
                    return;
                }

                tbody.innerHTML = libraries.map(lib => {
                    const statusClass = lib.archived ? 'bg-amber-100 text-amber-800' : lib.enabled ? 'bg-emerald-100 text-emerald-700' : 'bg-gray-100 text-gray-600';
                    const statusText = lib.archived ? '已归档' : lib.enabled ? '启用中' : '已停用';
                    return `
                        <tr>
                            <td class="p-3 font-medium text-gray-800">${escapeHtml(lib.name)}</td>
                            <td class="p-3 text-gray-600">${subjectLabel(lib.subject)}</td>
                            <td class="p-3 text-gray-600">${typeLabel(lib.library_type, lib.subject)}</td>
                            <td class="p-3 text-gray-600">${lib.total_items}</td>
                            <td class="p-3"><span class="px-2 py-1 rounded-full text-xs ${statusClass}">${statusText}</span></td>
                            <td class="p-3">
                                <div class="flex flex-wrap gap-2">
                                    <button onclick="location.href='/admin/learningcenter/library?id=${lib.id}'" class="px-2.5 py-1.5 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50">查看详情</button>
                                    ${lib.archived ? '' : `<button onclick="toggleStatus('${lib.id}', ${!lib.enabled})" class="px-2.5 py-1.5 rounded-lg ${lib.enabled ? 'bg-amber-500 text-white' : 'bg-emerald-600 text-white'}">${lib.enabled ? '停用' : '启用'}</button>`}
                                    <button onclick="toggleArchive('${lib.id}', ${!lib.archived})" class="px-2.5 py-1.5 rounded-lg ${lib.archived ? 'bg-indigo-600 text-white' : 'border border-amber-300 text-amber-700 hover:bg-amber-50'}">${lib.archived ? '取消归档' : '归档'}</button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                showNotice('error', `加载词库失败：${e.message || '网络错误'}`);
            }
        }

        loadLibraries();
    </script>
</body>
</html>
