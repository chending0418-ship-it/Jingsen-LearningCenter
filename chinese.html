<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Learning - Jingsen 学习中心 1.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-main: #F8F9FB;
            --chinese-accent: #FF4B4B;
            --chinese-theme: #FFEDED;
        }
        body { font-family: 'Inter', 'PingFang SC', sans-serif; background-color: var(--bg-main); }
        .option-btn { transition: all 0.2s ease; }
        .option-btn.selected { background-color: #FFEDED; border-color: #FF4B4B; color: #FF4B4B; }
        .option-btn.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        .option-btn.correct { background-color: #DEF7EC; border-color: #31C48D; color: #03543F; }
        .option-btn.wrong { background-color: #FDE8E8; border-color: #F98080; color: #9B1C1C; }
        
        .blank-space { 
            display: inline-block;
            min-width: 80px;
            padding: 0 8px;
            margin: 0 4px;
            border-bottom: 2px solid #FF4B4B;
            text-align: center;
            font-weight: bold;
            color: #FF4B4B;
            cursor: pointer;
            transition: all 0.2s;
        }
        .blank-space.active {
            background-color: #FFF5F5;
            border-bottom-width: 4px;
        }
        .blank-space.filled {
            color: #E02424;
        }
        .blank-space.correct { color: #057A55; border-color: #31C48D; }
        .blank-space.wrong { color: #C81E1E; border-color: #F98080; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <button id="back-btn" onclick="location.href='/portal'" class="text-gray-500 hover:text-gray-700 flex items-center gap-2 mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                    </svg>
                    返回门户
                </button>
                <h1 class="text-3xl font-bold text-gray-900">语文学习中心</h1>
            </div>
            <div id="progress-text" class="text-sm font-bold text-gray-400">准备就绪</div>
        </header>

        <!-- Configuration -->
        <div id="setup-section" class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-gray-100 mb-8">
            <h2 class="text-xl font-bold mb-6">题目设置</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">题型选择</label>
                    <select id="quiz-mode" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[var(--chinese-accent)] outline-none">
                        <option value="word_discrim">词语辨析 (四个句子)</option>
                        <option value="idiom_fill">成语填空 (一段话)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">题目组数</label>
                    <select id="quiz-count" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[var(--chinese-accent)] outline-none">
                        <option value="5">5 组</option>
                        <option value="10">10 组</option>
                    </select>
                </div>
            </div>
            <button onclick="startQuiz()" id="start-btn" class="w-full py-4 bg-[var(--chinese-accent)] text-white rounded-2xl font-bold text-lg hover:opacity-90 transition-all shadow-lg shadow-red-100">
                开始出题
            </button>
        </div>

        <!-- Quiz Section -->
        <div id="quiz-section" class="hidden">
            <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 mb-6 relative overflow-hidden">
                <div class="absolute top-0 left-0 h-1 bg-gray-100 w-full">
                    <div id="progress-bar" class="h-full bg-[var(--chinese-accent)] transition-all duration-300" style="width: 0%"></div>
                </div>
                <div id="question-content"></div>
            </div>
            <button id="next-btn" onclick="nextQuestion()" class="hidden w-full py-4 bg-gray-800 text-white rounded-2xl font-bold text-lg hover:bg-black transition-all">
                下一题
            </button>
        </div>

        <!-- Result Section -->
        <div id="result-section" class="hidden">
            <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 text-center mb-8">
                <div class="inline-flex items-center justify-center w-24 h-24 bg-red-50 rounded-full mb-6">
                    <span id="score-display" class="text-4xl font-bold text-red-600">0</span>
                </div>
                <h2 class="text-2xl font-bold mb-4">练习完成!</h2>
                <div id="summary-text" class="text-gray-600 mb-8 p-6 bg-gray-50 rounded-2xl text-left leading-relaxed"></div>
                <button onclick="location.reload()" class="px-8 py-3 border-2 border-gray-200 rounded-xl font-bold text-gray-600 hover:bg-gray-50">
                    重新开始
                </button>
            </div>
            <div id="wrong-questions-list" class="space-y-4">
                <h3 class="font-bold text-gray-900 px-2">错题回顾</h3>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-black/10 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-3xl shadow-xl flex flex-col items-center min-w-[300px]">
            <div class="relative w-20 h-20 mb-4">
                <div class="absolute inset-0 border-4 border-gray-100 rounded-full"></div>
                <div id="loading-circle" class="absolute inset-0 border-4 border-[var(--chinese-accent)] rounded-full border-t-transparent animate-spin"></div>
                <div id="loading-percent" class="absolute inset-0 flex items-center justify-center font-bold text-[var(--chinese-accent)]">0%</div>
            </div>
            <p class="font-medium text-gray-700" id="loading-text">正在为您精心出题...</p>
        </div>
    </div>

    <script>
        let groups = [];
        let currentIndex = 0;
        let score = 0;
        let totalSubQuestions = 0;
        let results = [];
        let quizInProgress = false;
        let activeBlankIndex = -1;
        let currentGroupAnswers = [];

        // Prevent browser back
        window.addEventListener('popstate', function (event) {
            if (quizInProgress) {
                history.pushState(null, null, window.location.href);
            }
        });

        async function startQuiz() {
            const mode = document.getElementById('quiz-mode').value;
            const count = parseInt(document.getElementById('quiz-count').value);
            const library = mode === 'word_discrim' ? 'chinese_words' : 'chinese_idioms';
            
            showLoading(true, 0);
            groups = [];
            totalSubQuestions = 0;
            
            try {
                // Fetch pool of words to avoid duplicates across groups
                const neededItems = count * 4;
                let itemPool = [];
                
                // Get a larger pool of items from the file
                const poolResponse = await fetch(`/api/chinese/generate?count=${count}&mode=${mode}&library=${library}&pool_only=true`);
                // Note: The backend logic might need adjustment if we wanted a true global pool,
                // but for now we'll improve the existing sequential fetch to be more robust.
                
                for (let i = 0; i < count; i++) {
                    const response = await fetch(`/api/chinese/generate?count=1&mode=${mode}&library=${library}`);
                    const data = await response.json();
                    if (data.error) throw new Error(data.error);
                    
                    if (mode === 'word_discrim') {
                        groups.push({
                            type: 'group',
                            questions: data.questions,
                            options: data.questions[0].options
                        });
                        totalSubQuestions += 4;
                    } else {
                        groups.push({
                            type: 'single',
                            question: data.questions[0],
                            options: data.questions[0].options
                        });
                        totalSubQuestions += 4;
                    }
                    
                    const percent = Math.round(((i + 1) / count) * 100);
                    showLoading(true, percent);
                }
                
                currentIndex = 0;
                score = 0;
                results = [];
                quizInProgress = true;

                history.pushState(null, null, window.location.href);
                document.getElementById('back-btn').classList.add('invisible');
                document.getElementById('setup-section').classList.add('hidden');
                document.getElementById('quiz-section').classList.remove('hidden');
                showQuestion();
            } catch (err) {
                alert('出题失败: ' + err.message);
                showLoading(false);
            } finally {
                showLoading(false);
            }
        }

        function showQuestion() {
            const group = groups[currentIndex];
            const container = document.getElementById('question-content');
            document.getElementById('next-btn').classList.add('hidden');
            
            const progress = ((currentIndex + 1) / groups.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('progress-text').innerText = `组 ${currentIndex + 1} / ${groups.length}`;

            activeBlankIndex = 0;
            currentGroupAnswers = [null, null, null, null];
            
            let html = '';
            if (group.type === 'group') {
                // Word Discrimination (4 separate sentences)
                html = `
                    <div class="mb-8 space-y-6">
                        ${group.questions.map((q, idx) => `
                            <div class="p-4 bg-gray-50 rounded-2xl border border-gray-100">
                                <p class="text-lg leading-relaxed text-gray-800">
                                    ${(idx + 1)}. ${q.sentence.replace('____', `<span onclick="selectBlank(${idx})" id="blank-${idx}" class="blank-space active">?</span>`)}
                                </p>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                // Idiom Fill (one paragraph with 4 blanks)
                let sentence = group.question.sentence;
                let blankIdx = 0;
                sentence = sentence.replace(/\(\d\)____/g, (match) => {
                    const idx = blankIdx++;
                    return `<span onclick="selectBlank(${idx})" id="blank-${idx}" class="blank-space ${idx === 0 ? 'active' : ''}">(${idx+1})?</span>`;
                });
                html = `
                    <div class="mb-8 p-6 bg-gray-50 rounded-2xl border border-gray-100">
                        <p class="text-xl leading-relaxed text-gray-800">${sentence}</p>
                    </div>
                `;
            }

            // Options Section
            html += `
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
                    ${group.options.map(opt => `
                        <button onclick="fillBlank('${opt}')" class="option-btn p-4 border border-gray-200 rounded-2xl hover:bg-white hover:shadow-md font-medium text-gray-700 bg-white">
                            ${opt}
                        </button>
                    `).join('')}
                </div>
                <button id="confirm-btn" onclick="checkGroupAnswer()" class="w-full py-4 bg-gray-800 text-white rounded-2xl font-bold text-lg opacity-50 cursor-not-allowed" disabled>
                    确认提交
                </button>
                <div id="explanation" class="hidden mt-8 p-6 bg-red-50 rounded-2xl text-red-800">
                    <h4 class="font-bold mb-2">解析：</h4>
                    <div id="explanation-content" class="text-sm leading-relaxed"></div>
                </div>
            `;
            
            container.innerHTML = html;
            selectBlank(0); // Auto select first blank
        }

        function selectBlank(idx) {
            if (document.getElementById('confirm-btn').classList.contains('hidden')) return;
            activeBlankIndex = idx;
            document.querySelectorAll('.blank-space').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });
        }

        function fillBlank(word) {
            if (activeBlankIndex === -1) return;
            
            // Check if this word is already used in other blanks
            const existingIndex = currentGroupAnswers.indexOf(word);
            if (existingIndex !== -1 && existingIndex !== activeBlankIndex) {
                // If used elsewhere, clear that blank
                currentGroupAnswers[existingIndex] = null;
                const otherBlank = document.getElementById(`blank-${existingIndex}`);
                otherBlank.innerText = group.type === 'group' ? '?' : `(${existingIndex+1})?`;
                otherBlank.classList.remove('filled');
            }

            currentGroupAnswers[activeBlankIndex] = word;
            const blank = document.getElementById(`blank-${activeBlankIndex}`);
            blank.innerText = word;
            blank.classList.add('filled');
            
            // Update options UI to show which is selected
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.toggle('selected', currentGroupAnswers.includes(btn.innerText.trim()));
            });
            
            // Check if all filled
            const allFilled = currentGroupAnswers.every(a => a !== null);
            const confirmBtn = document.getElementById('confirm-btn');
            if (allFilled) {
                confirmBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                confirmBtn.disabled = false;
                confirmBtn.classList.add('bg-[var(--chinese-accent)]');
            }

            // Auto move to next empty blank
            let nextEmpty = currentGroupAnswers.findIndex((a, i) => a === null && i > activeBlankIndex);
            if (nextEmpty === -1) nextEmpty = currentGroupAnswers.findIndex(a => a === null);
            if (nextEmpty !== -1) selectBlank(nextEmpty);
        }

        function checkGroupAnswer() {
            const group = groups[currentIndex];
            const confirmBtn = document.getElementById('confirm-btn');
            const nextBtn = document.getElementById('next-btn');
            const explanation = document.getElementById('explanation');
            const explanationContent = document.getElementById('explanation-content');
            
            confirmBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            explanation.classList.remove('hidden');

            let isGroupCorrect = true;
            let analysisHtml = '';

            if (group.type === 'group') {
                group.questions.forEach((q, idx) => {
                    const userAns = currentGroupAnswers[idx];
                    const isCorrect = userAns === q.answer;
                    const blank = document.getElementById(`blank-${idx}`);
                    
                    blank.classList.remove('active');
                    if (isCorrect) {
                        blank.classList.add('correct');
                        score++;
                    } else {
                        blank.classList.add('wrong');
                        blank.innerHTML = `${userAns} <span class="text-xs font-normal opacity-70">(正:${q.answer})</span>`;
                    }
                    
                    results.push({ ...q, userAnswer: userAns, isCorrect });
                    analysisHtml += `<div class="mb-2"><strong>${idx + 1}.</strong> ${q.analysis || '暂无解析'}</div>`;
                });
            } else {
                // Idiom Fill (answer is "(1)A, (2)B...")
                const answers = group.question.answer.split(',').map(s => s.replace(/\(\d\)/, '').trim());
                currentGroupAnswers.forEach((userAns, idx) => {
                    const correctAns = answers[idx];
                    const isCorrect = userAns === correctAns;
                    const blank = document.getElementById(`blank-${idx}`);
                    
                    blank.classList.remove('active');
                    if (isCorrect) {
                        blank.classList.add('correct');
                        score++;
                    } else {
                        blank.classList.add('wrong');
                        blank.innerHTML = `${userAns} <span class="text-xs font-normal opacity-70">(正:${correctAns})</span>`;
                    }
                    
                    results.push({ ...group.question, subIndex: idx, userAnswer: userAns, isCorrect, subAnswer: correctAns });
                });
                analysisHtml = group.question.analysis || '暂无解析';
            }

            explanationContent.innerHTML = analysisHtml;
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.add('disabled'));
            document.querySelectorAll('.blank-space').forEach(b => b.onclick = null);
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < groups.length) showQuestion();
            else showReport();
        }

        async function showReport() {
            quizInProgress = false;
            document.getElementById('back-btn').classList.remove('invisible');
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');
            
            const accuracy = Math.round((score / totalSubQuestions) * 100);
            document.getElementById('score-display').innerText = `${accuracy}%`;

            const wrongList = document.getElementById('wrong-questions-list');
            wrongList.innerHTML = '<h3 class="font-bold text-gray-900 px-2">错题回顾</h3>';
            
            results.filter(r => !r.isCorrect).forEach(w => {
                const item = document.createElement('div');
                item.className = 'bg-white rounded-2xl p-6 shadow-sm border border-gray-100';
                const correctAns = w.subAnswer || w.answer;
                item.innerHTML = `
                    <p class="mb-2 text-gray-800">${w.sentence}</p>
                    <div class="flex gap-4 text-sm">
                        <span class="text-red-500 font-bold">你的答案: ${w.userAnswer}</span>
                        <span class="text-green-600 font-bold">正确答案: ${correctAns}</span>
                    </div>
                    <p class="text-xs text-gray-500 mt-3 p-3 bg-gray-50 rounded-xl italic">${w.analysis}</p>
                `;
                wrongList.appendChild(item);
            });

            try {
                // Call Chinese grade endpoint for AI summary
                const response = await fetch('/api/chinese/grade', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        questions: results, 
                        answers: results.map((r,i)=>({question_index:i, user_answer:r.userAnswer})), 
                        mode: document.getElementById('quiz-mode').value 
                    })
                });
                const data = await response.json();
                document.getElementById('summary-text').innerText = data.summary;
            } catch (e) { 
                document.getElementById('summary-text').innerText = "练习结束，你的准确率为 " + accuracy + "%，继续加油！"; 
            }
        }

        function showLoading(show, percent = 0) {
            const overlay = document.getElementById('loading-overlay');
            if (show) {
                overlay.classList.remove('hidden');
                document.getElementById('loading-percent').innerText = `${percent}%`;
                // Simple circle animation sync
                const circle = document.getElementById('loading-circle');
                if (percent === 100) {
                    circle.classList.remove('animate-spin');
                } else {
                    circle.classList.add('animate-spin');
                }
            } else {
                overlay.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
